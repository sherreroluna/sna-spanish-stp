            if (!baseRange && gd._fullLayout && gd._fullLayout.xaxis) {
                var r = gd._fullLayout.xaxis.range;
                baseRange = Math.abs(r[1] - r[0]);
            }
        });
        gd.on('plotly_relayout', function() {
            if (!gd._fullLayout || !gd._fullLayout.xaxis) return;
            var r = gd._fullLayout.xaxis.range;
            var currentSpan = Math.abs(r[1] - r[0]);
            if (!baseRange) { baseRange = currentSpan; return; }
            var zoomFactor = baseRange / currentSpan;
            var showLabels = zoomFactor >= 2.5;
            var newMode = showLabels ? 'markers+text' : 'markers';
            var updates = [];
            gd.data.forEach(function(trace, i) {
                if (trace.type === 'scatter' && trace.marker && trace.mode !== newMode) {
                    updates.push(i);
                }
            });
            if (updates.length > 0) { Plotly.restyle(gd, { mode: newMode }, updates); }
        });
    }
    document.addEventListener('DOMContentLoaded', attachZoomListener);
})();
</script>
